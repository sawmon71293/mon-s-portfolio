<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#06243A"/>
    <stop offset=".55" stop-color="#0B3650"/>
    <stop offset="1" stop-color="#41617A"/>
  </linearGradient>
  <radialGradient id="moonGlow">
    <stop offset="0" stop-color="#FFE9A6" stop-opacity=".42"/>
    <stop offset=".55" stop-color="#FFE9A6" stop-opacity=".12"/>
    <stop offset="1" stop-color="#FFE9A6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hill1" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#083D3D"/><stop offset="1" stop-color="#0B4A43"/>
  </linearGradient>
  <linearGradient id="hill2" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#184B45"/><stop offset="1" stop-color="#315C45"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#5A351F"/><stop offset="1" stop-color="#35251D"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
</defs>

<!-- Sky -->
<rect width="1536" height="1024" fill="url(#sky)"/>

<!-- Moon -->
<circle cx="1225" cy="125" r="112" fill="url(#moonGlow)" filter="url(#soft)"/>
